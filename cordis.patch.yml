# Bundle layer contributed by @visol-456/dsh-llm-fallback.
#
# Declared via package.json `dsh.bundle` so `dsh plugin add @visol-456/dsh-llm-fallback`
# activates this plugin as a profile layer automatically. The plugin mounts with
# no chains (empty is valid and keeps it dormant); create chains from the
# Settings > Fallback page in the web UI.
- insert:
    - id: llm-fallback
      name: '@visol-456/dsh-llm-fallback'
